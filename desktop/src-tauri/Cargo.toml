[package]
name = "hermes-remote-desktop"
version = "0.1.0"
description = "Hermes Remote desktop app"
edition = "2021"
license = "MIT"

[lib]
name = "hermes_remote_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-shell = "2.5"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

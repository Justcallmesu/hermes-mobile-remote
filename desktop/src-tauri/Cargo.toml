[package]
name = "hermes-remote-desktop"
version = "0.1.0"
description = "Hermes Remote desktop app"
edition = "2021"
license = "MIT"

[lib]
name = "hermes_remote_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-shell = "2.5"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pre-added for later tickets (Cargo.toml is protected for workers):
# 05 LocalHttp + 07 Downloader (ureq), 07 hash/extract, 08 semver.
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
semver = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"

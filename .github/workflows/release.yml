name: Release

# Push a tag like v0.8.0 to publish a signed APK. Installed apps find it through
# Settings → System → "Check for updates", or on their own at startup.
# Push a tag like desktop-v0.2.0 to publish the desktop app (NSIS, AppImage, .deb and the updater's
# latest.json). Desktop releases carry their own tags so the phone's update check never sees them.
on:
  push:
    tags: ["v*.*.*", "desktop-v*.*.*"]

permissions:
  contents: write

jobs:
  apk:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Everything since the previous release must be in this tag's changelog section.
      - name: Changelog covers the diff since the last release
        run: |
          grep -qx "## $GITHUB_REF_NAME" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
          if grep -qx '## Unreleased' CHANGELOG.md; then
            echo "::error::Rename '## Unreleased' in CHANGELOG.md to '## $GITHUB_REF_NAME' before tagging"; exit 1
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          [ -z "$previous" ] || .github/scripts/check-changelog.sh "$previous" "$GITHUB_REF_NAME"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed APK
        working-directory: android
        env:
          APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: release
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are not set (see README, Releasing)"; exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/HermesRemote-$version.apk"
          (cd "$RUNNER_TEMP" && sha256sum "HermesRemote-$version.apk" > "HermesRemote-$version.apk.sha256")

      # Installed apps only accept updates signed with this key; refuse to publish anything else.
      - name: Check signature
        env:
          RELEASE_CERT_SHA256: d7aee96b41eb642c7e2c9282c95c8a02908712e23d0e66c7408646c89f0d0de9
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$RUNNER_TEMP"/HermesRemote-*.apk 2>&1) || { echo "$certs"; exit 1; }
          echo "$certs"
          echo "$certs" | grep -qE "Signer.* certificate SHA-256 digest: $RELEASE_CERT_SHA256" \
            || { echo "::error::APK is not signed with the release key"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the full CHANGELOG.md from this tag's section down, so someone skipping
        # versions sees everything since theirs. The app shows them on its update card.
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag {on = 1} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/HermesRemote-*.apk "$RUNNER_TEMP"/HermesRemote-*.apk.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  # The desktop app. Builds are unsigned (D24); the updater artifacts are signed with the updater key
  # (TAURI_SIGNING_PRIVATE_KEY, a repo secret nideta holds, D22). The version comes from the tag and must
  # match desktop/src-tauri/tauri.conf.json.
  desktop:
    if: startsWith(github.ref_name, 'desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "::error::tag $want but tauri.conf.json version $have"; exit 1; }
      - name: Updater key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set (see docs/desktop-app-design.md, D22)"; exit 1; }
          if grep -q PLACEHOLDER_UPDATER_PUBKEY desktop/src-tauri/tauri.conf.json; then
            echo "::error::set plugins.updater.pubkey in tauri.conf.json to the updater public key"; exit 1
          fi
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Hermes Remote desktop ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed.
          releaseDraft: true
          includeUpdaterJson: true

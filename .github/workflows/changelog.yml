name: Changelog

# A pull request that changes what users get must say so in CHANGELOG.md, under "## Unreleased".
# Its own workflow so adding or removing the "no changelog" label re-runs only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
        run: .github/scripts/check-changelog.sh "origin/${{ github.base_ref }}" HEAD
      - if: ${{ contains(github.event.pull_request.labels.*.name, 'no changelog') }}
        run: echo "Labelled 'no changelog'; check skipped."

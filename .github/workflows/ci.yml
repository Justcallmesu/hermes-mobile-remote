name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest -q

  # The bridge on Windows: the same tests, then the real PowerShell cmdlets the Windows host calls
  # and the real installer. A GitHub runner has Ethernet instead of Wi-Fi, but it has a default
  # route, a gateway and a firewall, which is what these code paths read.
  bridge-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest -q
      - name: The bridge has a machine-readable interface for the tray
        shell: pwsh
        run: |
          uv run hermes-remote-bridge doctor --json | ConvertFrom-Json | ForEach-Object {
            if (-not $_.checks) { throw 'doctor --json has no checks' }
            "doctor --json: $($_.checks.Count) checks, ids: $(($_.checks.id) -join ',')"
          }
          $d = uv run hermes-remote-bridge devices --json | ConvertFrom-Json
          if ($null -eq $d.devices) { throw 'devices --json has no devices key' }
          $t = uv run hermes-remote-bridge trust --list --json | ConvertFrom-Json
          if ($null -eq $t.trusted) { throw 'trust --list --json has no trusted key' }
          'devices/trust JSON keys present'
      - name: Host probes answer on real Windows
        shell: pwsh
        run: |
          uv run python -c "
          from hermes_remote_bridge.host import host
          from hermes_remote_bridge import network
          h = host(); assert h.name == 'windows', h.name
          print('interfaces      ', h.interface_ips())
          route = h.default_route(); print('default route   ', route); assert route, 'no default route'
          print('gateway mac     ', h.gateway_mac(route[1]))
          print('profile         ', h.network_profile(route[0]))
          print('firewall active ', h.firewall_active())
          print('current network ', network.current_network())
          print('config dir      ', h.config_dir())
          "
      - name: Bridge CLI runs
        shell: pwsh
        run: |
          uv run hermes-remote-bridge devices
          uv run hermes-remote-bridge trust --list
          # Doctor exits 1 here (no Hermes on a runner) but must still print; a crash has "error:".
          $out = uv run hermes-remote-bridge doctor 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'Traceback|error:') { exit 1 }
          exit 0
      - name: Native host answers match the Windows cmdlets (trusted networks must stay trusted)
        shell: pwsh
        run: |
          # The bridge used to ask PowerShell; it now asks Win32/COM (D9). The identity of a network
          # (route, router MAC, connection profile id) must come out the same, or a network the user
          # trusted before the upgrade would stop being trusted. pwsh here is only the test harness.
          $r = Get-NetRoute -DestinationPrefix '0.0.0.0/0' -AddressFamily IPv4 | ForEach-Object {
            $i = Get-NetIPInterface -InterfaceIndex $_.InterfaceIndex -AddressFamily IPv4
            [pscustomobject]@{ Alias = $_.InterfaceAlias; Gateway = $_.NextHop; Metric = [int]$_.RouteMetric + [int]$i.InterfaceMetric }
          } | Where-Object { $_.Gateway -ne '0.0.0.0' } | Sort-Object Metric | Select-Object -First 1
          $mac = (Get-NetNeighbor -IPAddress $r.Gateway -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.State -notin 'Unreachable','Incomplete' } | Select-Object -First 1).LinkLayerAddress
          $prof = Get-NetConnectionProfile -InterfaceAlias $r.Alias -ErrorAction SilentlyContinue | Select-Object -First 1
          $want = @{ alias = $r.Alias; gateway = $r.Gateway; mac = "$mac".ToLower().Replace('-', ':'); profile = "$($prof.InstanceID)" }
          $want | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/want.json"
          uv run python -c "
          import json, os, time
          from hermes_remote_bridge.host import host
          want = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'want.json'), encoding='utf-8-sig'))
          h = host()
          t = time.perf_counter(); route = h.default_route(); took = time.perf_counter() - t
          print('cmdlets', want); print('native ', route, h.gateway_mac(route[1]) if route else None,
                h.network_profile(route[0]) if route else None, f'route in {took*1000:.0f} ms')
          assert route == (want['alias'], want['gateway']), route
          if want['mac']: assert h.gateway_mac(route[1]) == want['mac'], h.gateway_mac(route[1])
          if want['profile']:
              prof = h.network_profile(route[0]); assert prof and prof[0] == want['profile'], prof
          assert took < 0.5, f'default_route took {took:.2f} s (PowerShell took ~0.8 s)'
          "
      - name: supervise stops when its parent closes stdin, and on a port conflict
        shell: pwsh
        run: |
          $confDir = Join-Path $env:LOCALAPPDATA 'hermes-remote\config'
          New-Item -ItemType Directory -Force -Path $confDir | Out-Null
          Set-Content -Path (Join-Path $confDir 'config.toml') -Encoding ASCII -Value "lan = true`nport = 18650"
          $exe = (Resolve-Path '.venv/Scripts/hermes-remote-bridge.exe').Path
          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe, 'supervise')
          $psi.RedirectStandardInput = $true; $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            try { $null = Invoke-WebRequest 'http://127.0.0.1:18650/v1/me' -UseBasicParsing -TimeoutSec 2 }
            catch { if ($_.Exception.Response) { $up = $true } }
          }
          if (-not $up) { throw 'supervise did not bring the bridge up' }
          # A second supervisor must stop on the port conflict (exit 76), not retry forever.
          # Its stdin stays open (an empty file would read as "parent closed" and stop it for the wrong reason).
          $psi2 = [System.Diagnostics.ProcessStartInfo]::new($exe, 'supervise')
          $psi2.RedirectStandardInput = $true; $psi2.UseShellExecute = $false
          $second = [System.Diagnostics.Process]::Start($psi2)
          if (-not $second.WaitForExit(60000)) { $second.Kill(); throw 'second supervise kept retrying' }
          if ($second.ExitCode -ne 76) { throw "second supervise exited $($second.ExitCode), want 76" }
          # Closing stdin is how the desktop app says goodbye.
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'supervise ignored stdin closing' }
          Start-Sleep -Seconds 2
          if (Get-NetTCPConnection -LocalPort 18650 -State Listen -ErrorAction SilentlyContinue) { throw 'port still held' }
          'supervise: up, conflict exit 76, stops on stdin close'
          Remove-Item (Join-Path $confDir 'config.toml')
      - name: No PowerShell in the plumbing (D1)
        shell: bash
        working-directory: .
        run: |
          if git ls-files '*.ps1' '*.cmd' | grep .; then echo "::error::scripts left"; exit 1; fi
          # Only the phone Terminal may start a PowerShell (the user's shell, D13); migration.rs only
          # recognises the old tray's command line. Comments and docstrings are fine.
          hits=$(git grep -n -i -e powershell -e pwsh -- bridge/hermes_remote_bridge desktop/src-tauri/src \
                 | grep -v -e 'terminal\.py:' -e 'migration\.rs:' \
                 | grep -v -E '^[^:]+:[0-9]+:[[:space:]]*(#|//|"""|[A-Za-z(`])' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::PowerShell spawned outside the terminal"; exit 1; fi

  # The desktop app (Tauri: Rust + Vue): Rust unit tests, Vue unit tests and a web build on both OSes,
  # then a debug bundle so a broken bundle config shows up before a release.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies (WebKitGTK 4.1, AppIndicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # The Windows install check below makes the bridge venv with uv (first-run setup would download it).
      - uses: astral-sh/setup-uv@v10.2.0
        if: runner.os == 'Windows'
      - run: npm ci --no-audit --no-fund
      - run: bash test.sh
      - name: Bundles build (unsigned, no updater artifacts)
        run: npx tauri build --debug --bundles ${{ runner.os == 'Linux' && 'appimage,deb' || 'nsis' }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # D17 on a real Windows runner: install the built NSIS per-user, the app owns the bridge (Job Object),
      # a hard kill of the app takes the bridge with it, and the uninstaller removes autostart and the old task.
      - name: NSIS install, bridge dies with the app, uninstall cleans up
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          # A script install leaves this task behind; the app must remove it (D12).
          schtasks /Create /TN "Hermes Mobile Remote" /TR "cmd.exe /c exit 0" /SC ONLOGON /F | Out-Null
          $setup = Get-ChildItem desktop/src-tauri/target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Hermes Remote'
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $app) { throw "no app exe under $dir" }
          # First-run setup downloads uv; on the runner the venv is made from the checkout instead.
          $data = Join-Path $env:LOCALAPPDATA 'hermes-remote'
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $data 'venv'
          uv sync --frozen --no-dev --directory bridge | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $data 'config') | Out-Null
          Set-Content (Join-Path $data 'config\config.toml') -Encoding ASCII -Value "lan = true"
          $p = Start-Process $app.FullName -PassThru
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            Start-Sleep -Seconds 1
            try { $null = Invoke-WebRequest 'http://127.0.0.1:8650/v1/me' -UseBasicParsing -TimeoutSec 2 }
            catch { if ($_.Exception.Response) { $up = $true } }
          }
          if (-not $up) { throw 'the installed app did not bring the bridge up' }
          & taskkill.exe /PID $p.Id /F | Out-Null
          Start-Sleep -Seconds 4
          if (Get-NetTCPConnection -LocalPort 8650 -State Listen -ErrorAction SilentlyContinue) { throw 'bridge outlived a hard kill of the app' }
          $uninst = Get-ChildItem $dir -Filter uninstall*.exe | Select-Object -First 1
          Start-Process $uninst.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          schtasks /Query /TN "Hermes Mobile Remote" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'old Scheduled Task still registered after uninstall' }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if ($run.PSObject.Properties.Name -contains 'Hermes Remote') { throw 'autostart left behind' }
          'installed, bridge died with the app, uninstall removed autostart and the old task'
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-remote-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/debug/bundle/appimage/*.AppImage
            desktop/src-tauri/target/debug/bundle/deb/*.deb
            desktop/src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: HermesRemote-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # The app's real socket and reducer code against the real bridge in front of the demo backend
  # (no Hermes, no model calls): a change to the event contract on either side fails here.
  e2e-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: uv sync
        working-directory: bridge
      - run: ./demo/e2e.sh
